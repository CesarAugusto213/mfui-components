name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAR
        run: ./gradlew :uikit:assembleRelease

      - name: Run unit + Paparazzi tests
        run: ./gradlew :uikit:testDebugUnitTest

      - name: Upload Paparazzi report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-report
          path: uikit/build/reports/paparazzi/
